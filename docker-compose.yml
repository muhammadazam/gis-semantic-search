services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    volumes:
      - model_cache:/root/.cache
    depends_on:
      - qdrant

  map:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./map:/usr/share/caddy
      - ./map/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - search

volumes:
  qdrant_storage:
  caddy_data:
  model_cache:
